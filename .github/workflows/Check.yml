# CI gate for PKMN-World (issue #32).
#
# Why this exists at all, given the pre-push hook says a local gate is the right process
# for this repo: `make check` runs the inherited upstream battle tests (5,498 as of
# 2026-08-02) through tools/mgba/mgba-rom-test. On the old WSL-on-ARM64 dev box the only
# bundled runner was an x86-64 ELF the shell could not execute: the hydra never launched,
# and the run ended in `Syntax error: "(" unexpected` followed by "No tests found" — a HOST
# limitation, not a failing test. ubuntu-latest is x86-64, so the bundled runner works
# natively there.
#
# UPDATE 2026-08-02: the dev box is now macOS/arm64, and tools/mgba/mgba-rom-test-mac is a
# universal binary with a native arm64 slice. `make check` therefore DOES run locally now
# (4,880 pass / 14 known-failing / 7 expect-failing / 597 to-do). This job is consequently
# a second opinion rather than the only place the suite can execute — keep it, but a red
# run here is no longer automatically a host problem.
#
# Unrelated to the above: the Testing/lua overworld suites cannot run in this workflow.
# They need a Lua-enabled headless emulator that is built from mGBA master with a local
# patch and is not in the tree — see Testing/mgba/README.md. They are a local gate only.
#
# The pre-push hook still runs the cheap host-side scans locally and stays the fast gate.
# The `validate` job below mirrors them so a `--no-verify` push is still caught.
#
# ⚠ THIS DOES NOT REINSTATE THE CI REMOVED IN 25d26c50. That workflow (build.yml) was
# deleted because it built and UPLOADED the ROM as a CI artifact, which effectively
# distributes it — against the fan-project terms. The objection was to publishing the
# build output, not to running a build. Nothing here uploads anything: the test ELF is
# produced in the runner's ephemeral workspace, read by the emulator, and discarded with
# the runner. Do not add actions/upload-artifact to this file.

name: Check

on:
  push:
    branches: [master]
    # A full run is ~23 minutes, which is not worth spending on a README tweak.
    # GitHub skips the workflow only when EVERY changed file matches one of these, so a
    # commit touching both a doc and a source file still runs. Note the consequence: a
    # docs-only push produces no run at all — that is the intended outcome here, not a
    # workflow that silently failed to start. .github/workflows/** is deliberately absent
    # so edits to this file still trigger it.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/*.png"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Content validation (host-side)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Invoked directly rather than through `make validate`: that target is not listed in
      # RULES_NO_SCAN, so going through make would trigger the full dependency scan and a
      # tools build in order to run two stdlib-only Python scripts.
      - name: Gen 1-3 species rules
        run: python3 Testing/ValidateGen13.py

      - name: Event-script pointer arguments
        run: python3 Testing/ValidateScripts.py

      - name: Overworld-Pokemon placements
        run: python3 Testing/ValidateOwMonPlacements.py

      - name: Map object-event consistency
        run: python3 Testing/ValidateMapEvents.py

      # DrawMetatileAt bounds-checks the 1024 split and nothing else, so a metatile id past the
      # end of its tileset indexes .rodata and draws the next symbol along (issue #93). Pins an
      # exact per-layout count for the maps that already do this, and fails if any count moves.
      - name: Map metatile bounds
        run: python3 Testing/ValidateMetatileBounds.py

      - name: Cleared-obstacle table freshness
        run: python3 Testing/GenObstacleTable.py --check

      # The save tool hard-codes the sector geometry and SaveBlock sizes it patches with.
      # A format bump that leaves them stale would not fail any build -- it would silently
      # write a save whose checksums land in the wrong place. This is that tripwire.
      - name: Save-format constants still match the tree
        run: python3 Testing/SavePatch.py --check

  test:
    name: make check (battle test suite)
    runs-on: ubuntu-latest
    # The test ELF is ~37 MB and the runner has 4 cores; the first uncached run is expected
    # to be slow. Well under the 6h job ceiling, but do not assume it is quick.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # libelf1 is what tools/mgba/mgba-rom-test links against (plus libm/libpthread/libc).
      # The rest is the modern arm-none-eabi toolchain this fork requires — agbcc is removed
      # and the Makefile hardcodes -DMODERN=1, so apt's gcc-arm-none-eabi + newlib is exactly
      # right here and none of the local symlink workarounds are needed.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev libelf1 python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
          key: tools-check-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      # TEST=1 is set automatically when `check` is the goal, but state it anyway so the
      # environment matches what the build actually compiles with.
      - name: make check
        env:
          GAME_VERSION: EMERALD
          TEST: 1
        run: make -j$(nproc) check

  # Deep-review task 41a: the TEST=1 build above is NOT the ROM players get — the #61
  # Pokévial off-switch rot shipped precisely because no gate ever compiled the shipping
  # configuration. This builds the plain default `make` target and discards it (nothing is
  # uploaded — see the 25d26c50 note at the top of this file).
  build:
    name: make (shipping configuration)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev libelf1 python3
      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
          key: tools-check-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}
      - name: make (default config)
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc)

  # Deep-review task 41b: non-default feature-flag states rot invisibly (#61 was found by
  # hand; the QOL_FIELD_MOVES_ITEM_GATE tail slide was found by review). Each leg flips ONE
  # documented switch and proves the tree still compiles. Compile-only; nothing uploaded.
  flag-matrix:
    name: flag off-switch compile (${{ matrix.flag }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flag: POKEVIAL_FEATURE, file: include/config/pokevial.h }
          - { flag: QOL_FIELD_MOVES_ITEM_GATE, file: include/config/qol_field_moves.h }
          - { flag: PW_GRAPHICAL_START_MENU, file: include/config/start_menu.h }
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev libelf1 python3
      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
          key: tools-check-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}
      - name: Flip ${{ matrix.flag }} to FALSE
        run: |
          grep -q "#define ${{ matrix.flag }}" "${{ matrix.file }}"
          sed -i "s/#define ${{ matrix.flag }}\([[:space:]]*\)TRUE/#define ${{ matrix.flag }}\1FALSE/" "${{ matrix.file }}"
          grep "#define ${{ matrix.flag }}" "${{ matrix.file }}"
      - name: make (flag off)
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc)
