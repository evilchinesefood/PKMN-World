# Automatic validation never builds the game or starts an emulator.
name: Check

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: host-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Content validation (host-side)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate tracked content and host behavior
        run: python3 test/validate-host.py
